<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6c4cff">
<title>Learnova V3 — AI Learning</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f8fc;color:#171827}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e5e7eb;z-index:5}
nav{max-width:1150px;margin:auto;padding:14px 18px;display:flex;gap:15px;align-items:center}
.logo{font-size:23px;font-weight:900;color:#6c4cff}.search{flex:1}
.search input{width:100%;padding:13px 16px;border:1px solid #ddd;border-radius:13px;outline:0}
.hero,main{max-width:1150px;margin:auto;padding:20px 18px}
.heroBox{padding:32px;border-radius:24px;background:linear-gradient(135deg,#25165f,#6c4cff,#987bff);color:white}
h1{font-size:clamp(32px,6vw,52px);margin:0}.hero p{font-size:17px;max-width:700px;color:#eee}
.ask{display:flex;gap:8px;max-width:780px}.ask input{flex:1;padding:13px;border:0;border-radius:11px}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:#171126;color:#fff}
.filters{display:flex;gap:8px;overflow:auto;margin:10px 0 20px}.filter{background:#fff;border:1px solid #ddd;white-space:nowrap}.active{background:#eee9ff!important;color:#6c4cff;border-color:#c9c0ff!important}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:17px;padding:17px}
.icon{font-size:27px;background:#eee9ff;width:52px;height:52px;display:grid;place-items:center;border-radius:14px}
.card h3{margin:12px 0 5px}.card p{color:#6b7280;font-size:13px;min-height:42px}.meta{font-size:12px;color:#777;display:flex;justify-content:space-between}
.open{width:100%;margin-top:13px;background:#f1effb;color:#6c4cff}
.ai{margin-top:28px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;overflow:hidden}
.aihead{padding:16px;border-bottom:1px solid #eee;font-weight:800}.chat{padding:17px;min-height:160px;max-height:400px;overflow:auto}
.msg{padding:11px 13px;border-radius:13px;max-width:85%;margin-bottom:9px;white-space:pre-wrap}.user{margin-left:auto;background:#6c4cff;color:white}.bot{background:#f0f1f5}
.chatbar{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}.chatbar input{flex:1;padding:11px;border:1px solid #ddd;border-radius:10px}
footer{text-align:center;color:#888;padding:25px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.ask{flex-direction:column}}
</style>
</head>
<body>
<header><nav><div class="logo">Learnova ✦</div><div class="search"><input id="search" placeholder="Search any subject or course..."></div><button onclick="ai.scrollIntoView({behavior:'smooth'})">AI Tutor</button></nav></header>

<section class="hero"><div class="heroBox">
<h1>Learn anything.<br>Ask your AI tutor.</h1>
<p>Search subjects, open a learning topic, or ask Learnova AI to explain anything in simple language.</p>
<div class="ask"><input id="heroQ" placeholder="Ask: Explain the Indian Constitution"><button class="primary" onclick="ask('heroQ')">Ask AI</button></div>
</div></section>

<main>
<h2>Explore subjects</h2>
<div class="filters">
<button class="filter active" onclick="filter('All',this)">All</button>
<button class="filter" onclick="filter('Technology',this)">Technology</button>
<button class="filter" onclick="filter('History',this)">History</button>
<button class="filter" onclick="filter('Science',this)">Science</button>
<button class="filter" onclick="filter('Business',this)">Business</button>
<button class="filter" onclick="filter('Languages',this)">Languages</button>
<button class="filter" onclick="filter('Exam Prep',this)">Exam Prep</button>
</div>
<div id="courses" class="grid"></div>

<section id="ai" class="ai">
<div class="aihead">🟢 Learnova AI Tutor</div>
<div id="chat" class="chat"><div class="msg bot">Hi! Ask me about any subject, chapter, concept or exam topic.</div></div>
<div class="chatbar"><input id="q" placeholder="Ask your question..." onkeydown="if(event.key==='Enter')ask('q')"><button class="primary" onclick="ask('q')">Send</button></div>
</section>
</main>
<footer>Learnova V3 • AI-powered learning platform</footer>

<script>
const API_BASE="https://learnova-ai.rpavankumar570.workers.dev";
const data=[
["Indian Constitution","History","🇮🇳","Constitution, Fundamental Rights, DPSP and Parliament."],
["Modern Indian History","History","📜","Freedom movement, Gandhi era, British rule and independence."],
["World History","History","🌍","Civilizations, empires, revolutions and world wars."],
["Computer Science","Technology","💻","Programming, algorithms, databases and core CS."],
["Web Development","Technology","🌐","HTML, CSS, JavaScript, APIs and web apps."],
["Artificial Intelligence","Technology","🤖","AI, machine learning and neural networks."],
["Physics","Science","⚛️","Motion, force, energy, electricity and formulas."],
["Chemistry","Science","🧪","Atoms, reactions, bonding and chemistry basics."],
["Biology","Science","🧬","Cells, genetics, human biology and ecology."],
["Economics","Business","📈","Demand, supply, markets and national income."],
["Entrepreneurship","Business","🚀","Business ideas, validation, marketing and finance."],
["English","Languages","🔤","Grammar, vocabulary, writing and speaking."],
["Kannada","Languages","ಕ","Grammar, literature, writing and communication."],
["Competitive Exams","Exam Prep","🎯","GK, reasoning, current topics and exam preparation."]
];
let category="All";
function render(list){
courses.innerHTML=list.length?list.map(x=>`<article class="card"><div class="icon">${x[2]}</div><h3>${x[0]}</h3><p>${x[3]}</p><div class="meta"><span>${x[1]}</span><span>Learn</span></div><button class="open" onclick="start(${JSON.stringify(x[0])})">Learn this subject</button></article>`).join(""):'<p>No matching subject found.</p>';
}
function filter(c,b){category=c;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(c==="All"?data:data.filter(x=>x[1]===c));}
search.oninput=()=>{let s=search.value.toLowerCase().trim();render(data.filter(x=>(x[0]+" "+x[1]+" "+x[3]).toLowerCase().includes(s)));};
function start(name){q.value="Teach me "+name+" from beginner level. Give me a simple learning plan and the first lesson.";ai.scrollIntoView({behavior:"smooth"});setTimeout(()=>ask("q"),400);}
function add(t,c){let d=document.createElement("div");d.className="msg "+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
async function ask(id){
let input=document.getElementById(id),text=input.value.trim();if(!text)return;
add(text,"user");input.value="";let wait=add("Thinking...","bot");
try{
let r=await fetch(API_BASE+"/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:text})});
let j=await r.json().catch(()=>({}));wait.remove();
if(!r.ok) return add("AI request failed ("+r.status+"). Check the Cloudflare Worker /ask route.","bot");
let answer=j.answer||j.response||j.text||j.message;
add(answer||"Worker responded, but no answer field was returned. Expected {answer:'...'}","bot");
}catch(e){wait.remove();add("Could not connect to Learnova AI. Check Worker URL, /ask route and CORS.","bot");}
}
render(data);
</script>
</body>
</html>
